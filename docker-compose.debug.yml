version: '3.8'

services:
  web:
    build: .
    ports:
      - "9001:9001"
      - "5678:5678"  # debugpy port
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DEBUG=1
    command: >
      python -m debugpy --listen 0.0.0.0:5678 --wait-for-client
      -m uvicorn src.api.main:app --host 0.0.0.0 --port 9001 --reload
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: celonis_garage_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
